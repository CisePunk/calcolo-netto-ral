# Ambiente di sviluppo completo.
#
#     docker compose up
#
# Al primo avvio il database viene creato, popolato con lo schema e con il seed
# generato da dati/coefficienti.json. Non serve nessun passaggio manuale: chi
# apre il repository deve poterlo far partire senza istruzioni.
#
# Rigenerare il seed dopo aver modificato i coefficienti:
#     python3 strumenti/genera_seed.py
#     docker compose down -v && docker compose up

services:
  database:
    image: mysql:8.4
    container_name: pb-database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sviluppo}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-registro}
    ports:
      # 3307 sull'host per non litigare con un MySQL gia' installato.
      #
      # Legato a 127.0.0.1 e non a tutte le interfacce: senza il prefisso,
      # Docker pubblica la porta su 0.0.0.0 e il database diventa raggiungibile
      # da chiunque sia sulla stessa rete — con la password di sviluppo.
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      # I file in questa cartella vengono eseguiti in ordine alfabetico al
      # primo avvio, quando il volume dei dati e' ancora vuoto.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - dati-mysql:/var/lib/mysql
    healthcheck:
      # Serve a far aspettare l'API: MySQL risponde al ping molto prima di
      # essere pronto ad accettare query.
      test: ["CMD", "mysql", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-sviluppo}", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  dati-mysql:
