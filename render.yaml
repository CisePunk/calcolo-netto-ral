# Pubblicazione su Render.
#
# Un servizio solo: l'API serve anche l'interfaccia compilata, quindi non serve
# nient'altro. MySQL NON entra qui, ed e' voluto — a runtime il registro dei
# coefficienti e' il JSON versionato, e il database resta uno strumento di
# verifica. Vedi README.
#
# Perche' Docker e non il runtime Python
# --------------------------------------
# Per costruire servono due mondi: Node per compilare React, Python per eseguire
# FastAPI. Un servizio Python su Render non ha `npm`, un servizio Node non ha
# `uvicorn`. Il Dockerfile a due stadi risolve la cosa e ha un vantaggio in piu':
# quello che gira in produzione e' la stessa immagine che si costruisce in
# locale con `docker build`, quindi si prova prima invece di scoprirlo dopo.
services:
  - type: web
    name: calcolo-netto-ral
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/salute
